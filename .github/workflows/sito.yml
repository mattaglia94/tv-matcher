name: Run dal sito
run-name: "${{ inputs.run_id }} | ${{ inputs.nome }}"
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Identificativo (generato dal sito)"
        required: true
      nome:
        description: "Nome della ricerca"
        required: false
        default: ""
      config:
        description: "Configurazione JSON (generata dal sito)"
        required: true
permissions:
  contents: write
jobs:
  matching:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.56.0 openpyxl
      - run: python -m playwright install --with-deps chromium
      - name: Matching
        env:
          CONFIG: ${{ inputs.config }}
          RUN_ID: ${{ inputs.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python -u app/web_runner.py
