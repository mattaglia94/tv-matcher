name: Run dal sito
run-name: "${{ inputs.run_id }} | ${{ inputs.nome }}"
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Identificativo (generato dal sito)"
        required: true
      nome:
        description: "Nome della ricerca"
        required: false
        default: ""
      config:
        description: "Configurazione JSON (generata dal sito)"
        required: true
permissions:
  contents: write
jobs:
  piano:
    # ricerche grandi divise in parti, ognuna su una macchina GitHub diversa (in parallelo)
    runs-on: ubuntu-24.04
    outputs:
      parti: ${{ steps.p.outputs.parti }}
      n: ${{ steps.p.outputs.n }}
    steps:
      - id: p
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          python3 - <<'PY'
          import json, os, math
          n = len(json.loads(os.environ["CONFIG"]).get("asin", []))
          k = max(1, min(8, math.ceil(n / 12)))   # ~12 ASIN per macchina, al massimo 8 macchine
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"parti={json.dumps(list(range(k)))}\n")
              f.write(f"n={k}\n")
          PY
  matching:
    needs: piano
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        parte: ${{ fromJSON(needs.piano.outputs.parti) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.56.0 openpyxl
      - name: Installa il browser
        timeout-minutes: 12
        # a volte i server dei pacchetti Ubuntu si bloccano: limite di 4 minuti per tentativo, poi si riprova
        run: |
          for i in 1 2 3; do
            timeout 240 python -m playwright install --with-deps chromium && exit 0
            echo "installazione non riuscita (tentativo $i), riprovo"
            sudo pkill -f "apt-get|dpkg" || true; sleep 3; sudo dpkg --configure -a || true
            sudo apt-get update -o Acquire::Retries=3 || true
          done
          exit 1
      - name: Matching
        env:
          CONFIG: ${{ inputs.config }}
          RUN_ID: ${{ inputs.run_id }}
          PARTE: ${{ matrix.parte }}
          PARTI: ${{ needs.piano.outputs.n }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python -u app/web_runner.py
