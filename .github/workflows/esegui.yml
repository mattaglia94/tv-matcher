name: Esegui matching TV
on:
  workflow_dispatch:
    inputs:
      paese:
        description: "Paese (IT, DE, FR, ES, UK)"
        default: "IT"
  schedule:
    - cron: "0 6 1 * *"   # ogni 1° del mese alle 8:00 (IT)
jobs:
  matching:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.56.0 openpyxl
      - name: Installa il browser
        timeout-minutes: 12
        # a volte i server dei pacchetti Ubuntu si bloccano: limite di 4 minuti per tentativo, poi si riprova
        run: |
          for i in 1 2 3; do
            timeout 240 python -m playwright install --with-deps chromium && exit 0
            echo "installazione non riuscita (tentativo $i), riprovo"
            sudo pkill -f "apt-get|dpkg" || true; sleep 3; sudo dpkg --configure -a || true
            sudo apt-get update -o Acquire::Retries=3 || true
          done
          exit 1
      - run: python -u app/tv_matcher.py --input input_tv_matcher.xlsx --paese ${{ inputs.paese || 'IT' }} --output output
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: Output_matching, path: output/ }
