name: Esegui matching TV
on:
  workflow_dispatch:
    inputs:
      paese:
        description: "Paese (IT, DE, FR, ES, UK)"
        default: "IT"
  schedule:
    - cron: "0 6 1 * *"   # ogni 1° del mese alle 8:00 (IT)
jobs:
  matching:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.56.0 openpyxl
      - name: Prepara il browser
        # Edge e Chrome sono già installati sulle macchine GitHub e il motore usa quelli:
        # qui si scarica solo Chromium di riserva, senza pacchetti di sistema (che a volte si bloccano)
        timeout-minutes: 5
        continue-on-error: true
        run: timeout 180 python -m playwright install chromium || echo "uso Edge/Chrome già presenti sulla macchina"
      - run: python -u app/tv_matcher.py --input input_tv_matcher.xlsx --paese ${{ inputs.paese || 'IT' }} --output output
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: Output_matching, path: output/ }
