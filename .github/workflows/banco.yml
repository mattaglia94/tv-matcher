name: Banco di prova
run-name: "banco | ${{ inputs.fase }} ${{ inputs.paesi }}"
on:
  workflow_dispatch:
    inputs:
      fase:
        description: "raccogli | confronta"
        required: true
        default: raccogli
      paesi:
        description: "Paesi (JSON)"
        required: false
        default: '["IT","DE","FR","ES","UK"]'
      config:
        description: "Per confronta: JSON {paese: config}"
        required: false
        default: "{}"
permissions:
  contents: write
jobs:
  banco:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        paese: ${{ fromJSON(inputs.paesi) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.56.0 openpyxl
      - run: python -m playwright install --with-deps chromium
      - name: Raccolta
        if: inputs.fase == 'raccogli'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LOTTO: ${{ inputs.config != '{}' && inputs.config || '' }}
        run: python -u app/banco.py raccogli ${{ matrix.paese }}
      - name: Sonda
        if: inputs.fase == 'sonda'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          URLS: ${{ inputs.config }}
        run: python -u app/banco.py sonda
      - name: Confronto
        if: inputs.fase == 'confronta'
        env:
          TUTTE: ${{ inputs.config }}
          PAESE: ${{ matrix.paese }}
          RUN_ID: banco-${{ github.run_id }}-${{ matrix.paese }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python -c "import json,os;c=json.loads(os.environ['TUTTE']);open('cfg.json','w').write(json.dumps(c[os.environ['PAESE']]))"
          python -u app/web_runner.py cfg.json
